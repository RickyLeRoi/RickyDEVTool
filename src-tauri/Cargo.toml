[package]
name = "rickydevtool"
version = "3.0.0"
description = "Developer operations console locale"
authors = ["Riccardo Giordano"]
edition = "2021"

[lib]
name = "rickydevtool_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["ws", "multipart"] }
tower-http = { version = "0.6", features = ["cors"] }
rust-embed = "8"
mime_guess = "2"
anyhow = "1"
dirs = "6"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
local-ip-address = "0.6"
rand = "0.9"
qrcode = "0.14"
sysinfo = "0.33"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip", "json", "multipart"] }
hickory-resolver = "0.24"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
x509-parser = "0.16"
tokio-util = { version = "0.7", features = ["io"] }
futures-util = "0.3"
socket2 = { version = "0.5", features = ["all"] }
rusqlite = { version = "0.32", features = ["bundled"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# 20260704 RG enigo solo su mac/win: su Linux tirerebbe dentro X11.
[target.'cfg(target_os = "macos")'.dependencies]
enigo = "0.3"

[target.'cfg(target_os = "windows")'.dependencies]
enigo = "0.3"
windows-sys = { version = "0.59", features = ["Win32_UI_Input_KeyboardAndMouse", "Win32_System_SystemInformation", "Win32_System_Power"] }

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
