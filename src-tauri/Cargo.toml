[package]
name = "rickydevtool"
version = "0.1.0"
description = "Developer operations console locale"
authors = ["Riccardo Giordano"]
edition = "2021"

[lib]
name = "rickydevtool_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["ws"] }
tower-http = { version = "0.6", features = ["cors"] }
rust-embed = "8"
mime_guess = "2"
anyhow = "1"
dirs = "6"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
local-ip-address = "0.6"
rand = "0.9"
qrcode = "0.14"
sysinfo = "0.33"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Movimento del mouse per l'anti-idle: solo mac/win (enigo su Linux tira X11).
[target.'cfg(target_os = "macos")'.dependencies]
enigo = "0.3"

[target.'cfg(target_os = "windows")'.dependencies]
enigo = "0.3"
windows-sys = { version = "0.59", features = ["Win32_UI_Input_KeyboardAndMouse", "Win32_System_SystemInformation"] }

[dev-dependencies]
tempfile = "3"
